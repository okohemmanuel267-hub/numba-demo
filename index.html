.nb-root{--ink:#171A33;--muted:#5B5E7A;--line:#E3E4EE;--mint:#127A5A;--coral:#C93C48;
  --soft:color-mix(in srgb,var(--onbrand) 14%,transparent);--sub:color-mix(in srgb,var(--onbrand) 78%,transparent);
  min-height:100vh;background:color-mix(in srgb,var(--brand) 26%,#E6E6EC);transition:background .3s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px 12px;
  font-family:'DM Sans',system-ui,sans-serif;color:var(--ink)}
.nb-root *{box-sizing:border-box}
.nb-root button{font-family:inherit;cursor:pointer}
.nb-root button:focus-visible,.nb-root input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.nb-phone{width:100%;max-width:380px;height:760px;background:linear-gradient(165deg,#1d2b64 0%,#3b2a78 58%,#6b3a8f 100%);color:#fff;border-radius:40px;border:8px solid var(--ink);overflow:hidden;position:relative}
.nb-appwrap{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;background:var(--brand);color:var(--onbrand);overflow:hidden;border-radius:32px;transform-origin:40% 62%;animation:nbopen .4s cubic-bezier(.2,.8,.2,1);transition:background .3s}
@keyframes nbopen{from{transform:scale(.18) translate(-10%,40%);opacity:0;border-radius:60px}to{transform:none;opacity:1;border-radius:32px}}
.nb-appwrap::before{content:"";position:absolute;width:300px;height:300px;border-radius:50%;right:-120px;top:-100px;background:var(--soft)}
.nb-appwrap::after{content:"";position:absolute;width:230px;height:230px;border-radius:50%;left:-100px;bottom:120px;border:36px solid var(--soft)}
.nb-body{position:relative;z-index:1;flex:1;overflow-y:auto;padding:18px 18px 14px}
.nb-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.nb-word{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px;letter-spacing:-0.02em}
.nb-soft{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--soft);font-weight:600;font-size:13px}
.nb-h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:34px;line-height:1.02;letter-spacing:-0.025em;margin:0 0 10px}
.nb-hero{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:44px;line-height:1;letter-spacing:-0.03em;margin:6px 0 12px}
.nb-h2{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:18px;margin:20px 0 10px}
.nb-p{font-size:15px;line-height:1.45;color:var(--sub);margin:0 0 16px}
.nb-pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.nb-w{background:#fff;color:var(--ink);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 8px 20px -10px rgba(0,0,0,.35)}
.nb-w .nb-p{color:var(--muted)}
.nb-ct{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:17px;margin:0 0 4px}
.nb-btn{width:100%;border:0;border-radius:18px;padding:16px;font-size:16px;font-weight:700;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px}
.nb-btn[disabled]{opacity:.4;cursor:not-allowed}
.nb-btn.soft{background:#fff;color:var(--ink)}
.nb-btn.brand{background:var(--btn);color:var(--onbtn)}
.nb-btn.danger{background:#fff;color:var(--coral)}
.nb-btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.nb-input{width:100%;font-size:26px;letter-spacing:.14em;font-weight:700;padding:18px;border-radius:20px;border:0;background:#fff;color:var(--ink);margin-bottom:8px}
.nb-bar{display:flex;gap:6px;margin-bottom:18px}
.nb-bar i{flex:1;height:6px;border-radius:3px;background:var(--soft)}
.nb-bar i.on{background:var(--onbrand)}
.nb-badge{display:inline-flex;align-items:center;justify-content:center;font-weight:800;border-radius:10px;padding:5px 10px;font-size:14px}
.nb-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.nb-row:last-child{border-bottom:0;padding-bottom:2px}
.nb-row:first-child{padding-top:2px}
.nb-row .grow{flex:1}
.nb-row b{display:block;font-size:15px}
.nb-row .sub{font-size:13px;color:var(--muted)}
.nb-seg{display:flex;background:var(--tint);border-radius:14px;padding:4px;gap:4px;margin:10px 0}
.nb-seg button{flex:1;border:0;background:transparent;border-radius:11px;padding:10px 4px;font-size:14px;font-weight:600;color:var(--muted)}
.nb-seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.nb-call{border-radius:18px;padding:14px;text-align:center;background:var(--tint)}
.nb-call small{color:var(--muted);font-size:13px}
.nb-call strong{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:22px;margin:4px 0}
.nb-ver{display:inline-flex;align-items:center;gap:4px;color:var(--mint);font-weight:700;font-size:13px}
.nb-tabs{position:relative;z-index:2;margin:0 12px 2px;background:#fff;border-radius:26px;display:flex;padding:6px;gap:4px;box-shadow:0 10px 24px -8px rgba(0,0,0,.4)}
.nb-tabs button{flex:1;border:0;background:transparent;border-radius:20px;padding:7px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted)}
.nb-tabs button.on{background:var(--btn);color:var(--onbtn)}
.nb-code{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:28px;letter-spacing:.12em;margin:6px 0 10px}
.nb-reveal{border:0;background:var(--tint);color:var(--ink);font-weight:700;font-size:14px;padding:9px 14px;border-radius:12px;display:inline-flex;gap:6px;align-items:center}
.nb-sw{width:50px;height:30px;border-radius:99px;border:0;background:var(--line);position:relative;flex:none;transition:background .15s}
.nb-sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.nb-sw[aria-checked="true"]{background:var(--mint)}
.nb-sw[aria-checked="true"]::after{transform:translateX(20px)}
.nb-scan{width:200px;height:200px;border-radius:50%;margin:8px auto 22px;background:#fff;border:5px dashed var(--onbrand);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.nb-scan.scanning{animation:nbspin 1.6s linear infinite}
.nb-scan.scanning svg{animation:nbspin 1.6s linear infinite reverse}
.nb-scan.done{border-style:solid;color:var(--mint)}
@keyframes nbspin{to{transform:rotate(360deg)}}
.nb-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.nb-net{border:0;background:#fff;border-radius:16px;padding:13px 4px;display:flex;justify-content:center}
.nb-net.on{box-shadow:inset 0 0 0 3px var(--ink)}
.nb-opt{width:100%;text-align:left;border:0;background:#fff;border-radius:18px;padding:15px 16px;margin-bottom:8px;font-size:17px;font-weight:700;color:var(--ink);display:flex;justify-content:space-between;align-items:center;gap:8px}
.nb-opt small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.nb-opt.on{box-shadow:inset 0 0 0 3px var(--ink)}
.nb-price{font-size:14px;font-weight:700;color:var(--brandtext)}
.nb-step{display:flex;gap:12px;margin-bottom:14px}
.nb-step:last-child{margin-bottom:0}
.nb-dot{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;background:var(--tint);color:var(--ink)}
.nb-dot.ok{background:var(--mint);color:#fff}
.nb-dot.now{background:#E0A029;color:#fff}
.nb-alert{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.4}
.nb-alert.warn{background:#FFF1D1;color:#6B4600}
.nb-alert.bad{background:#FBE1E4;color:#8E1F2B}
.nb-alert.info{background:#FFF6E0;color:#7A5210}
.nb-meter{height:18px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 6px}
.nb-meter i{display:block;height:100%;border-radius:99px;transition:width .15s}
.nb-range{width:100%;accent-color:var(--brandtext)}
.nb-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nb-tile{border:0;text-align:left;border-radius:22px;padding:14px;background:#fff;color:var(--ink);display:flex;flex-direction:column;gap:6px;min-height:138px}
.nb-tile.wide{grid-column:span 2;background:var(--ink);color:#fff;min-height:0;flex-direction:row;align-items:center;gap:14px}
.nb-tile.invite{grid-column:span 2;background:var(--tint);min-height:0;flex-direction:row;align-items:center;gap:12px;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--brand) 55%,#fff)}
.nb-ic{width:42px;height:42px;border-radius:14px;background:var(--tint);color:var(--brandtext);display:flex;align-items:center;justify-content:center;flex:none}
.nb-tile.wide .nb-ic{background:var(--accent);color:var(--onaccent);width:50px;height:50px;border-radius:16px}
.nb-tile b{font-size:16px;font-family:'Bricolage Grotesque',sans-serif}
.nb-tile span.d{font-size:13px;line-height:1.35;opacity:.8}
.nb-go{margin-top:auto;font-size:13px;font-weight:700;color:var(--brandtext)}
.nb-tile.wide .nb-go{color:var(--accent);margin:4px 0 0}
.nb-offers{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:0 18px 6px}
.nb-offer{flex:none;width:210px;scroll-snap-align:start;background:#fff;color:var(--ink);border-radius:22px;padding:14px}
.nb-offer em{font-style:normal;font-size:12px;font-weight:700;color:var(--muted);display:block;margin-bottom:8px}
.nb-offer b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:17px;line-height:1.2;margin-bottom:10px}
.nb-art{position:relative;height:230px;margin:6px 0 18px}
.nb-simchip{position:absolute;left:50%;top:52%;width:236px;height:150px;transform:translate(-50%,-50%) rotate(-7deg);filter:drop-shadow(0 18px 18px rgba(0,0,0,.3))}
.nb-simface{width:100%;height:100%;background:#fff;color:var(--ink);padding:16px;clip-path:polygon(0 0,76% 0,100% 26%,100% 100%,0 100%);border-radius:20px}
.nb-pad{width:60px;height:46px;border-radius:9px;background:linear-gradient(135deg,#F5D77A,#C9A13B);position:relative;overflow:hidden}
.nb-pad::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 14px,rgba(0,0,0,.25) 14px 15px),repeating-linear-gradient(90deg,transparent 0 19px,rgba(0,0,0,.25) 19px 20px)}
.nb-simface b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:22px;letter-spacing:-.01em;margin-top:14px}
.nb-simface span{font-size:13px;color:var(--muted);font-weight:600}
.nb-float{position:absolute;background:var(--ink);color:#fff;font-weight:700;font-size:13px;padding:8px 14px;border-radius:99px;display:flex;gap:6px;align-items:center;box-shadow:0 8px 14px -6px rgba(0,0,0,.4)}
.nb-modal{position:absolute;inset:0;background:rgba(15,15,35,.55);display:flex;align-items:flex-end;z-index:5}
.nb-sheet{background:#fff;color:var(--ink);width:100%;border-radius:30px 30px 0 0;padding:24px 22px 26px}
.nb-sheet .nb-h2{margin:0 0 6px}
.nb-perk{display:flex;gap:10px;align-items:center;font-size:15px;margin:8px 0}
.nb-perk svg{color:var(--mint);flex:none}
.nb-theme{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:13px;font-weight:700}
.nb-theme button{border:3px solid transparent;background:transparent;padding:2px;border-radius:12px}
.nb-theme button.on{border-color:var(--ink)}
.nb-jump{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:430px}
.nb-jump button{border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:99px;padding:7px 14px;font-weight:700;font-size:13px}
.nb-jump button.on{background:var(--ink);color:#fff}

.nb-homebar{flex:none;border:0;background:transparent;height:24px;display:flex;align-items:center;justify-content:center;position:relative;z-index:2}
.nb-homebar i{width:120px;height:5px;border-radius:3px;background:var(--onbrand);opacity:.55}
.nb-launcher{position:absolute;inset:0;display:flex;flex-direction:column;padding:14px 18px 18px;color:#fff}
.nb-status{display:flex;justify-content:space-between;font-weight:700;font-size:15px;padding:2px 10px 0}
.nb-status span{display:flex;gap:6px;align-items:center;font-size:13px}
.nb-clock{margin-top:34px;text-align:center}
.nb-clock b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:68px;line-height:1;letter-spacing:-0.03em}
.nb-clock span{font-size:15px;opacity:.85}
.nb-apps{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 4px;margin-top:40px}
.nb-app{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:transparent;color:#fff;font-size:12px;font-weight:500;padding:0}
.nb-ico{width:62px;height:62px;border-radius:17px;display:flex;align-items:center;justify-content:center;color:#fff}
.nb-pingwrap{position:relative;display:flex;border-radius:17px}
.nb-pingwrap::after{content:"";position:absolute;inset:-4px;border-radius:21px;border:3px solid #35E0A1;opacity:0;animation:nbping 1.6s ease-out 3}
@keyframes nbping{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.35);opacity:0}}
.nb-hint{margin-top:auto;align-self:center;font-size:13px;background:rgba(255,255,255,.16);border-radius:99px;padding:8px 14px}
.nb-dock{margin-top:14px;background:rgba(255,255,255,.18);border-radius:30px;padding:14px 10px;display:grid;grid-template-columns:repeat(4,1fr);justify-items:center}
.nb-chat{max-height:250px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.nb-bub{max-width:86%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.4}
.nb-bub.agent{background:var(--tint);align-self:flex-start;border-bottom-left-radius:4px}
.nb-bub.you{background:var(--ink);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.nb-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.nb-chipbtn{border:0;background:#fff;border-radius:99px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.nb-send{display:flex;gap:8px}
.nb-send input{flex:1;min-width:0;border:0;background:var(--tint);border-radius:14px;padding:12px 14px;font-size:15px;color:var(--ink)}
.nb-send button{border:0;background:var(--btn);color:var(--onbtn);border-radius:14px;width:46px;display:flex;align-items:center;justify-content:center}

.nb-spd{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:14px;margin-bottom:4px}
.nb-spd.me{background:var(--tint)}
.nb-spd .nb-badge{min-width:58px}
.nb-spd .bar{flex:1;height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.nb-spd .bar i{display:block;height:100%;border-radius:99px;transition:width .4s}
.nb-spd b{width:76px;text-align:right;font-size:14px;line-height:1.15}
.nb-spd b small{display:block;font-size:11px;font-weight:700}
.nb-spd b small.Fast{color:var(--mint)}
.nb-spd b small.Good{color:#9A6B00}
.nb-spd b small.Slow{color:var(--coral)}
.nb-opt,.nb-net,.nb-input{box-shadow:inset 0 0 0 1.5px var(--line)}
.nb-w,.nb-offer{box-shadow:0 0 0 1px rgba(23,26,51,.07),0 8px 20px -12px rgba(0,0,0,.3)}
.nb-scan.no{border-style:solid;color:var(--coral)}
.nb-link{width:100%;border:0;background:transparent;display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);text-align:left;color:var(--ink);font-size:15px;font-weight:700}
.nb-link:last-child{border-bottom:0}
.nb-link:first-child{padding-top:2px}
.nb-link .grow{flex:1}
.nb-link small{display:block;font-size:13px;font-weight:500;color:var(--muted)}
.nb-chipbtn.on{background:var(--ink);color:#fff;box-shadow:none}
.nb-cbrow{display:flex;gap:12px;align-items:flex-start;text-align:left;border:0;background:transparent;padding:9px 0;color:var(--ink);width:100%}
.nb-cb{width:26px;height:26px;border-radius:8px;box-shadow:inset 0 0 0 2px var(--muted);display:flex;align-items:center;justify-content:center;flex:none;color:#fff;margin-top:1px}
.nb-cb.on{background:var(--ink);box-shadow:none}
.nb-cbrow b{display:block;font-size:15px}
.nb-cbrow small{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-top:2px}
@media (prefers-reduced-motion:reduce){.nb-spd .bar i{transition:none}.nb-appwrap,.nb-pingwrap::after{animation:none}.nb-root,.nb-phone,.nb-meter i,.nb-sw,.nb-sw::after{transition:none}.nb-scan.scanning,.nb-scan.scanning svg{animation:none}}
@media (max-width:520px){
.nb-root{padding:0;gap:0;justify-content:flex-start;min-height:100dvh;background:var(--brand)}
.nb-phone{max-width:none;width:100%;height:100vh;height:100dvh;border:0;border-radius:0}
.nb-appwrap{border-radius:0;animation:none}
.nb-theme,.nb-jump,.nb-homebar{display:none}
.nb-body{padding-top:calc(18px + env(safe-area-inset-top))}
.nb-tabs{margin-bottom:calc(8px + env(safe-area-inset-bottom))}
